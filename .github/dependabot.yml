version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all
    commit-message:
      prefix: "build(deps)"
